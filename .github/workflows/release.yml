name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Archive pour HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer empreinte.zip
        run: cd custom_components/empreinte && zip -r ../../empreinte.zip . -x "__pycache__/*"
      - name: Joindre à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" empreinte.zip --clobber
